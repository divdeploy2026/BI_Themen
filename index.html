<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Themenübersicht Erklärvideo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1411;--ink:#E9EEEA;--muted:#9aa7a0;--red:#CD281E;--dg:#1E5A2B;--hg:#6DB33F;--zg:#D7F0C8;--gr:#232826;color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1411}}
:root[data-theme="dark"]{--bg:#0f1411}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#wrap{flex:1;position:relative;overflow:hidden;min-height:0}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#19231d 0%,#111713 62%,#0c100e 100%)}
#lines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
#lines path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1}
.e{position:absolute;left:0;top:0;transform:translate(-50%,-50%);will-change:transform,opacity;visibility:hidden}
.txt{text-align:center;line-height:1.25}
.gk{color:#CD281E;background:#fff;padding:0 .16em;border-radius:.16em}
.warn{color:#FFD21E;font-weight:900}
/* header */
#hdr{position:absolute;left:0;top:0;width:100%;background:#fff;border-bottom:5px solid var(--hg);z-index:5;text-align:center}
#hdr .h1{font-weight:900;letter-spacing:.06em;line-height:1}
#hdr .hl{position:absolute;left:50%;transform:translateX(-50%);height:2px;background:var(--dg)}
.hs{font-weight:800;color:var(--gr);white-space:nowrap;z-index:6}
/* pieces */
.cap{font-weight:700;color:var(--ink);text-align:center;line-height:1.3;z-index:30}
.cap small{display:block;font-size:.6em;color:var(--muted);font-weight:600;margin-top:.35em}
.big{font-weight:900;color:#fff;text-align:center;line-height:1.1;letter-spacing:-.01em}
.dpbox{background:#f6f4f2;border-radius:16px;border-top:8px solid var(--hg);box-shadow:0 14px 40px rgba(0,0,0,.45)}
.dx{color:var(--gr);text-align:left;z-index:60}
.dx .dxc{display:inline-block;color:#fff;font-weight:800;font-size:.7em;border-radius:7px;padding:.2em .6em;margin-bottom:.5em}
.dx .dxn{font-size:.62em;font-weight:700;color:#7a827e;margin-bottom:.9em;text-transform:uppercase;letter-spacing:.06em}
.dx .dxt{font-size:1.55em;font-weight:900;line-height:1.1;margin-bottom:.6em;color:var(--gr)}
.dx .dxb{font-weight:600;line-height:1.45}
.dx .dxs{margin-top:1em;font-size:.66em;font-weight:600;color:#7a827e;line-height:1.35}
.zeit{font-weight:800;color:var(--hg);text-align:center;letter-spacing:.01em}
.kick{font-weight:800;color:var(--ink);text-align:center;line-height:1.3}
.kick .emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.intro{font-weight:600;color:#cfd8d3;text-align:center;line-height:1.75}
.intro .kp{display:inline-block;color:#fff;font-weight:800;border-radius:8px;padding:0 .45em;line-height:1.5;white-space:nowrap}
.sub{font-weight:600;color:var(--muted);text-align:center;line-height:1.35}
.badge{border-radius:50%;background:#fff;border:5px solid #111;box-shadow:0 0 0 4px #fff;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.badge img{width:78%;display:block}
.name{font-weight:800;color:#fff;text-align:center;line-height:1.2}
.name small{display:block;font-weight:600;color:var(--muted);font-size:.72em}
.lbl{font-weight:700;color:var(--zg);text-align:center;line-height:1.25}
.fact{border:2px solid rgba(233,238,234,.55);border-radius:12px;padding:.45em .7em;font-weight:700;text-align:center;color:#fff;background:rgba(255,255,255,.04);line-height:1.2}
.prom{border:2px solid var(--hg);border-radius:12px;padding:.45em .7em;font-weight:700;text-align:center;color:var(--zg);background:rgba(109,179,63,.16);line-height:1.2}
.q{border:2px solid var(--red);border-radius:14px;padding:.5em .75em;font-weight:700;text-align:center;color:#fff;background:#1d2320;line-height:1.2;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.qm{font-weight:900;color:#ff5a4c;text-shadow:0 0 18px rgba(205,40,30,.6)}
.pan{border:3px solid rgba(233,238,234,.7);border-top-width:6px;border-radius:0 0 26px 26px;background:rgba(255,255,255,.03)}
.beam{background:#E9EEEA;border-radius:6px}
.logo{background:#fff;border-radius:12px;padding:0;box-shadow:0 12px 40px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.logo img{width:93%;display:block}
.person{color:var(--zg)}
.fadeb{-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
.person svg{width:100%;height:100%;display:block}
.qb{border-radius:50%;background:var(--red);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;border:3px solid #fff}
.tile{border-radius:10px;border:3px solid transparent}
.tt{text-align:center;font-weight:800;line-height:1.12;pointer-events:none}
.tt .d{font-weight:600;font-size:calc(var(--sub,0) * .74em);opacity:var(--sub,0);line-height:1.2;margin-top:calc(var(--sub,0) * .25em);color:inherit}
.tt .d{filter:opacity(.85)}
.cl{border-radius:10px;color:#fff;font-weight:800;display:flex;align-items:center;line-height:1.15;padding:0 .8em}
.fd{border-radius:10px;display:flex;flex-direction:column;justify-content:center;padding:0 .7em;font-weight:600;line-height:1.5;color:rgba(233,238,234,.55);-webkit-mask-image:linear-gradient(90deg,#000 10%,transparent 85%);mask-image:linear-gradient(90deg,#000 10%,transparent 85%)}
.dots{font-weight:900;letter-spacing:.12em}
.num{border-radius:50%;background:var(--red);color:#fff;border:.13em solid #fff;font-weight:900;display:flex;align-items:center;justify-content:center;z-index:45;overflow:visible;box-shadow:inset 0 0 0 .08em rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.4)}
.num::before{content:'';position:absolute;left:50%;top:50%;width:.85em;height:.26em;background:#fff;border-radius:.12em;transform:translate(.62em,.62em) rotate(45deg);transform-origin:0 50%;box-shadow:0 0 0 .05em #222}
.num::after{content:'';position:absolute;left:14%;top:12%;width:30%;height:18%;border-radius:50%;background:rgba(255,255,255,.35);transform:rotate(-30deg)}
.pill{background:#fff;color:var(--red);font-weight:800;border-radius:999px;padding:.25em .9em;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;z-index:45}
.ctitle{font-weight:900;color:#fff;text-align:center;line-height:1.12;z-index:45}
.creason{font-weight:600;color:var(--zg);text-align:center;line-height:1.35;z-index:45}
.pt{font-weight:600;color:var(--gr);text-align:left;line-height:1.3;z-index:52;padding-left:1.1em;text-indent:-1.1em}
.pt b{color:#D75F3C}
.src{font-weight:600;color:#6b726e;text-align:center;z-index:52}
.ev{font-weight:900;color:#fff;text-align:center;z-index:45}
.ev span{color:var(--hg)}
/* controls */
#ctl{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:#0b0f0d;border-top:1px solid #1f2924}
#ctl button{background:#1b231f;color:var(--ink);border:1px solid #2c3a33;border-radius:10px;font:600 14px Inter,system-ui,sans-serif;padding:8px 12px;cursor:pointer;white-space:nowrap;min-height:38px}
#ctl button:hover{background:#24302a}
#ctl button.pri{background:var(--dg);border-color:var(--hg)}
#bar{flex:1;position:relative;height:38px;cursor:pointer;min-width:60px}
#track{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:#24302a;overflow:hidden}
#fill{position:absolute;left:0;top:0;bottom:0;background:var(--hg);width:0}
.tick{position:absolute;top:10px;width:2px;height:10px;background:#0b0f0d}
#chap{position:absolute;left:0;top:22px;font:600 12px Inter,system-ui,sans-serif;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media (max-width:560px){#ctl{gap:6px;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}#ctl button{padding:8px 9px;font-size:13px}.lab{display:none}}
#landing{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;text-align:center;background:radial-gradient(ellipse at 50% 40%,#19231d 0%,#0f1411 70%)}
#landing .card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 14px 44px rgba(0,0,0,.5);width:min(440px,80vw)}
#landing .card img{width:100%;display:block}
#landing .inv{font-weight:700;font-size:clamp(20px,3.2vw,30px);color:var(--ink);line-height:1.4}
#landing .inv a{color:var(--hg);font-weight:800;text-decoration:none;border-bottom:2px solid var(--hg)}
#landing .inv a:hover{color:#fff}
#landing .web a{color:var(--muted);font-weight:600;font-size:clamp(15px,2vw,19px);text-decoration:none}
#landing .web a:hover{color:#fff}
#cd{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;background:rgba(11,15,13,.92);border:2px solid var(--hg);border-radius:16px;padding:14px 24px;font-weight:700;font-size:clamp(15px,2vw,22px);color:var(--ink);text-align:center;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.5);white-space:nowrap}
#cd b{color:var(--hg);font-size:1.3em;font-variant-numeric:tabular-nums}
#menu{position:fixed;display:none;z-index:200;background:#141a17;border:1px solid #2c3a33;border-radius:12px;padding:8px;min-width:220px;box-shadow:0 12px 36px rgba(0,0,0,.55);font:600 14px Inter,system-ui,sans-serif;color:var(--ink)}
#menu .h{font-size:12px;color:var(--muted);padding:6px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
#menu .sp{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:2px 6px 8px}
#menu .sp button{background:#1b231f;border:1px solid #2c3a33;color:var(--ink);border-radius:8px;padding:7px 0;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
#menu .sp button.on{background:var(--dg);border-color:var(--hg)}
#menu label{display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid #24302a;cursor:pointer}
#menu input{width:18px;height:18px;accent-color:#6DB33F}
</style>
</head>
<body>
<div id="landing"><div class="card"><img id="landLogo" alt="Logo Bürgerinitiative Lebenswertes Schlüchtern"></div><div class="inv">Melden Sie sich gerne:<br><a id="mail" href="#"></a></div><div class="web"><a id="web" href="#" target="_blank" rel="noopener"></a></div></div>
<div id="menu"><div class="h">Tempo</div><div class="sp" id="spd"></div><label><input type="checkbox" id="rot"> Endlosschleife (Rotate)</label><label><input type="checkbox" id="det"> Themen im Detail am Ende</label><div class="h">Sekunden pro Thema</div><div class="sp" id="dsec"></div></div>
<div id="app">
  <div id="wrap"><div id="stage"></div><div id="cd">In <b id="cdn">15</b> Sekunden beginnt die Erläuterung von vorne</div></div>
  <div id="ctl">
    <button id="bBack" title="Zurück (←)">◀<span class="lab"> Zurück</span></button>
    <button id="bPlay" class="pri" title="Pause/Abspielen (Leertaste)">❚❚<span class="lab"> Pause</span></button>
    <button id="bNext" title="Weiter (→)"><span class="lab">Weiter </span>▶</button>
    <div id="bar"><div id="track"><div id="fill"></div></div><div id="chap"></div></div>
    <button id="bFs" title="Vollbild (F)">⤢</button>
  </div>
</div>

function set(o,id,p){o[id]=Object.assign(o[id]||{},p)}
function many(o,ids,p){ids.forEach(id=>set(o,id,typeof p==='function'?p(id):p))}
const range=n=>[...Array(n).keys()];
const tileIds=()=>TILES.flatMap(t=>['tb'+t.i,'tt'+t.i]);
function plantPath(){const a=TX(1075,250),b=L.p?[720,520]:[1440,535];return`M${a[0]} ${a[1]} C${a[0]+60} ${a[1]} ${b[0]-20} ${b[1]+50} ${b[0]} ${b[1]+22}`}
function tileHome(o,t,extra){const c=cell(t.row,t.col),K=KAT[t.k];
  set(o,'tb'+t.i,Object.assign({x:c.x,y:c.y,w:c.w,h:c.h,r:0,s:1,o:1,bg:[...K[1],1],bc:[...K[1],1]},extra&&extra.b));
  set(o,'tt'+t.i,Object.assign({x:c.x,y:c.y,w:c.w-12,r:0,s:1,o:1,fs:P(18.5,18),fg:[35,40,38,1]},extra&&extra.t));}
function hiTile(o,t){tileHome(o,t,{b:{bg:[30,90,43,1],bc:[205,40,30,1]},t:{fg:[255,255,255,1]}});}
function numHome(o,n){const t=TILES[SPT[n]],c=cell(t.row,t.col);set(o,'num'+n,{x:c.x+c.w/2-24,y:c.y-c.h/2+4,w:P(34,32),h:P(34,32),fs:P(18,17),o:1,s:1})}
function cardRect(j){return L.p?{x:450,y:330+j*262,w:840,h:240}:{x:800+(j-1.5)*375,y:480,w:350,h:450}}
function cardLayout(o,n,dim){const j=n-1,c=cardRect(j),t=TILES[SPT[n]],op=dim?0.35:1;
  set(o,'tb'+t.i,{x:c.x,y:c.y,w:c.w,h:c.h,o:op,bg:[30,90,43,1],bc:[205,40,30,1],z:40});
  if(!L.p){set(o,'num'+n,{x:c.x-12,y:c.y-170,w:52,h:52,fs:26,o:op});set(o,'pill'+n,{x:c.x,y:c.y-112,fs:15,o:op});
    set(o,'tt'+t.i,{x:c.x,y:c.y-55,w:310,fs:32,sub:0,o:op,fg:[255,255,255,1],z:45});set(o,'cr'+n,{x:c.x,y:c.y+95,w:310,fs:17,o:op});}
  else{set(o,'num'+n,{x:c.x-365,y:c.y-10,w:52,h:52,fs:26,o:op});set(o,'pill'+n,{x:c.x+40,y:c.y-88,fs:15,o:op});

 {ch:5,hold:4.4,cap:'Und es gibt noch viele weitere Aspekte',fn(o){
   ORDER.forEach((k,r)=>{const f=fadeRect(r);set(o,'fd'+k,{x:f.x,y:f.y,w:f.w,h:f.h,fs:P(13.5,26),o:1,clip:1,_d:r*.15,_t:1.1});});}},
 {ch:6,hold:5,cap:'Am 02.12.2026 stellt die Bürgerinitiative im KuBe vier Themen exemplarisch vor',fn(o){
   TILES.forEach(t=>{if(!t.sp){set(o,'tb'+t.i,{o:.28});set(o,'tt'+t.i,{o:.28});}});
   ORDER.forEach(k=>{set(o,'cl'+k,{o:.4});set(o,'fd'+k,{o:.25});});
   [1,2,3,4].forEach(n=>{const t=TILES[SPT[n]];hiTile(o,t);set(o,'tt'+t.i,{sub:1});set(o,'tb'+t.i,{depth:1});numHome(o,n);set(o,'num'+n,{_d:.5+n*.3,_e:'back'});});}},
 {ch:6,hold:4.8,cap:'Vier Themen aus vier verschiedenen Themengebieten, konkret erklärt',fn(o){
   TILES.forEach(t=>{if(!t.sp){set(o,'tb'+t.i,{o:.06});set(o,'tt'+t.i,{o:.06});}});
   ORDER.forEach(k=>{set(o,'cl'+k,{o:.06});set(o,'fd'+k,{o:.05});});
   [1,2,3,4].forEach(n=>{cardLayout(o,n,false);const t=TILES[SPT[n]];set(o,'tb'+t.i,{_d:(n-1)*.2,_t:1.3});set(o,'tt'+t.i,{_d:(n-1)*.2,_t:1.3});set(o,'num'+n,{_d:(n-1)*.2,_t:1.3});
     set(o,'pill'+n,{_d:1+(n-1)*.2});set(o,'cr'+n,{_d:1.3+(n-1)*.2});});
   set(o,'ev',{x:L.W/2,y:P(198,182),w:P(1200,840),fs:P(34,30),o:1,clip:1,_d:.6});}},
 ...[1,2,3,4].map(m=>({ch:6,hold:5.6,cap:[null,
   'Umwelt: 188.000 t CO₂ pro Jahr, so viel wie 4 × Frankfurter Kreuz',
   'Finanzen: 3,5 Mio. € pro Jahr sind eine unbelegte Erwartungshaltung der Stadt. Die Werte scheinen keiner Prüfung standzuhalten',
   'Transparenz: Vorgespräche ohne Gremien ab April/Mai, dann Umsetzungsversuch unter Zeitdruck und ab August nur positive Kommunikation',
   'Risiko: Ein Tag Reserve sind rund 218.400 kg H₂ am Stadtrand, das 590-Fache der Menge, die 1991 in Hanau explodierte'][m],
   fn(o){[1,2,3,4].forEach(n=>cardLayout(o,n,n!==m));}})),
{ch:7,hold:()=>DETAILS?6:9999,cap:'42 Themen in 7 Themengebieten. Und es gibt noch viel mehr.<small>Ihr Thema fehlt? Sprechen Sie uns an. · 02.12.2026 · KuBe Schlüchtern</small>',fn(o){
   set(o,'ev',{o:0,_t:.6});
   [1,2,3,4].forEach(n=>{set(o,'pill'+n,{o:0,_t:.5});set(o,'cr'+n,{o:0,_t:.5});});
   TILES.forEach(t=>{const d=t.sp?.4:1.2+t.row*.06;tileHome(o,t);set(o,'tt'+t.i,{sub:1});set(o,'tb'+t.i,{depth:.6,_d:d});set(o,'tt'+t.i,{_d:d});});
   [1,2,3,4].forEach(n=>{hiTile(o,TILES[SPT[n]]);const t=TILES[SPT[n]];set(o,'tb'+t.i,{_d:.4,_t:1.3});set(o,'tt'+t.i,{_d:.4,_t:1.3});numHome(o,n);set(o,'num'+n,{_d:.4,_t:1.3});});
   ORDER.forEach(k=>{set(o,'cl'+k,{o:1,_d:1});set(o,'fd'+k,{o:1,_d:1.2});});}},
];
const FINAL=BASE_STEPS[BASE_STEPS.length-1];
const DORDER=ORDER.flatMap(k=>TILES.filter(t=>t.k===k));
function detailStep(j){const cur_t=DORDER[j];return {ch:8,hold:()=>DSEC*SPEED,cap:'',fn(o){
  DZ=true;
  TILES.forEach(t=>{const hl=t.i===cur_t.i;if(t.sp)hiTile(o,t);else tileHome(o,t);
    set(o,'tt'+t.i,{sub:L.p?0:1,fs:P(15.5,14),w:cell(t.row,t.col).w-10,o:hl?1:.42,s:hl?1.12:1,z:hl?31:'auto'});
    set(o,'tb'+t.i,{o:hl?1:.42,s:hl?1.12:1,depth:hl?1:0,z:hl?30:'auto',bc:hl?[255,255,255,1]:(t.sp?[205,40,30,1]:[...KAT[t.k][1],1])});});
  ORDER.forEach((k,r)=>{const lr=labRect(r);set(o,'cl'+k,{x:lr.x,y:lr.y,w:lr.w,h:lr.h,fs:P(14,13),o:k===cur_t.k?1:.55});set(o,'fd'+k,{o:0,_t:.6});});
  [1,2,3,4].forEach(n=>{numHome(o,n);const hl=SPT[n]===cur_t.i;set(o,'num'+n,{o:hl?1:.5,z:hl?46:45});});
  const pb=P({x:1395,y:448,w:370,h:680},{x:450,y:1350,w:860,h:470});
  set(o,'dpBox',{x:pb.x,y:pb.y,w:pb.w,h:pb.h,o:1,_t:1});
  DORDER.forEach((t,jj)=>set(o,'dx'+t.i,jj===j?{x:pb.x,y:pb.y+P(10,8),w:pb.w-48,fs:P(19,24),o:1,_d:.35,_t:.8}:{o:0,_t:.35}));
  if(L.p)set(o,'logo',{o:0});
  DZ=false;}}}
const CLOSE_STEP={ch:7,hold:9999,cap:FINAL.cap,fn(o){FINAL.fn(o);
  TILES.forEach(t=>{set(o,'tt'+t.i,{fs:P(18.5,18),s:1,z:'auto'});set(o,'tb'+t.i,{s:1,z:'auto'});});
  ORDER.forEach((k,r)=>{const lr=labRect(r);set(o,'cl'+k,{x:lr.x,y:lr.y,w:lr.w,h:lr.h,fs:P(17,15.5)});});
  set(o,'dpBox',{o:0});DORDER.forEach(t=>set(o,'dx'+t.i,{o:0,_t:.4}));set(o,'logo',{o:1});}};
let STEPS=BASE_STEPS;
function composeSteps(){STEPS=DETAILS?BASE_STEPS.concat(DORDER.map((t,j)=>detailStep(j)),[CLOSE_STEP]):BASE_STEPS;}
const holdOf=st=>typeof st.hold==='function'?st.hold():st.hold;
composeSteps();

/* ================= Zustände ================= */
let S=[],T=[];
function buildStates(){
  const cur={};DEFS.forEach(d=>cur[d.id]=Object.assign({},DEF,d.base));
  S=[];T=[];
  STEPS.forEach((st,n)=>{
    const o={};st.fn(o);
    // Kopfzeile + Untertitel
    CHAPTERS.forEach((c,i)=>set(o,'hs'+i,{x:L.W/2,y:P(72,96),fs:P(26,30),o:i===st.ch?1:0,_t:.7,_d:i===st.ch?.25:0}));
    const withLogo=n>=11, cp=capPos(withLogo);
    STEPS.forEach((s2,j)=>{ if(j===n&&s2.cap) set(o,'cap'+j,{x:cp.x,y:cp.y,w:cp.w,fs:P(27,29),o:1,clip:1,_d:.45,_t:1.1});
      else if(cur['cap'+j].o>0||j===n) set(o,'cap'+j,{o:0,_t:.4,_d:0}); });
    // Logo immer gleich positioniert ab Schritt 10
    const tm={};
    for(const id in o){const p=o[id],t={};['_d','_t','_e','_m'].forEach(k=>{if(k in p){t[k.slice(1)]=p[k];delete p[k];}});tm[id]=t;
      if(!cur[id]) {console.warn('unbekannt',id);continue;}
      cur[id]=Object.assign({},cur[id],p);}
    S.push(JSON.parse(JSON.stringify(cur)));T.push(tm);});
}

/* ================= Render ================= */
const stage=document.getElementById('stage'),wrap=document.getElementById('wrap');
let svgL=null;
function build(){
  stage.innerHTML='';
  stage.style.width=L.W+'px';stage.style.height=L.H+'px';
  const h=document.createElement('div');h.id='hdr';
  const hh=P(92,124);h.style.height=hh+'px';
  h.innerHTML=`<div class="h1" style="font-size:${P(32,36)}px;padding-top:${P(16,22)}px"><span style="color:#CD281E">GASKRAFTWERK</span> <span style="color:#1E5A2B">SCHLÜCHTERN</span></div><div class="hl" style="top:${P(52,66)}px;width:${P(640,760)}px"></div>`;
  stage.appendChild(h);
  svgL=document.createElementNS('http://www.w3.org/2000/svg','svg');svgL.id='lines';
  svgL.setAttribute('width',L.W);svgL.setAttribute('height',L.H);svgL.setAttribute('viewBox',`0 0 ${L.W} ${L.H}`);
  svgL.innerHTML='<defs><marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#D7F0C8"/></marker></defs>';
  EL={};
  defineAll();
  DEFS.forEach(d=>{
    let node;
    if(d.kind==='p'){node=document.createElementNS('http://www.w3.org/2000/svg','path');node.setAttribute('pathLength','1');
      const col={neg:'#D7F0C8',bir:'#D7F0C8',stand:'#E9EEEA',strL:'#9aa7a0',strR:'#9aa7a0'}[d.id]||'#fff';
      node.setAttribute('stroke',col);node.setAttribute('stroke-width',{stand:8,neg:3,bir:3}[d.id]||2.5);
      if(d.id==='neg')node.setAttribute('marker-end','url(#ar)'),node.setAttribute('marker-start','url(#ar)');
      if(d.id==='bir')node.setAttribute('marker-end','url(#ar)'),node.setAttribute('stroke-dasharray','1 1');
      svgL.appendChild(node);}
    else{node=document.createElement('div');node.className='e '+d.cls;node.innerHTML=d.html;stage.appendChild(node);}
    EL[d.id]={kind:d.kind,node,cur:Object.assign({},DEF,d.base)};
  });
  // Linien unter die Elemente, aber über Stadt: nach town/plant einsortieren
  stage.insertBefore(svgL,EL.bm.node);
}
function rgba(c){return`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${c[3]==null?1:c[3]})`}
function apply(el){
  const c=el.cur,n=el.node;
  if(el.kind==='p'){if(c.dd!=null)n.setAttribute('d',c.dd);n.style.strokeDashoffset=String(1-c.draw);n.style.opacity=c.o;return;}
  const st=n.style;
  st.left=c.x+'px';st.top=c.y+'px';
  if(c.w!=null)st.width=c.w+'px'; if(c.h!=null)st.height=c.h+'px';
  st.transform=`translate(-50%,-50%) rotate(${c.r}deg) scale(${c.s})`;
  const o=Math.max(0,Math.min(1,c.o));st.opacity=o;st.visibility=o<0.004?'hidden':'visible';
  if(c.fs!=null)st.fontSize=c.fs+'px';
  if(c.bg)st.backgroundColor=rgba(c.bg); if(c.fg)st.color=rgba(c.fg); if(c.bc)st.borderColor=rgba(c.bc);
  st.clipPath=(c.clip<.999||c.rise<.999)?`inset(${((1-c.rise)*100).toFixed(2)}% ${((1-c.clip)*100).toFixed(2)}% 0 0)`:'none';
  const dp=c.depth;st.boxShadow=dp>.005?`${5*dp}px ${5*dp}px 0 -1px rgba(255,255,255,${.16*dp}),${10*dp}px ${10*dp}px 0 -2px rgba(255,255,255,${.08*dp})`:'none';
  st.setProperty('--sub',c.sub);
  if(c.z!=null)st.zIndex=c.z;
}
const EASE={io:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,out:p=>1-Math.pow(1-p,3),back:p=>{const c1=1.4,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)}};

let cur=-1,anim=null,playing=true,holdAcc=0,lastNow=performance.now();
function goTo(n,mode){
  n=Math.max(0,Math.min(STEPS.length-1,n));
  const fast=mode==='back'||mode==='jump';
  const tgt=S[n],tm=T[n],items=[];let maxEnd=0;
  for(const id in tgt){const el=EL[id];if(!el)continue;const from=el.cur,to=tgt[id];
    let diff=false;for(const k in to){if(JSON.stringify(from[k])!==JSON.stringify(to[k])){diff=true;break}}
    if(!diff)continue;
    STR.forEach(k=>{if(to[k]!=null)from[k]=to[k]});
    const t=tm[id]||{};
    if(from.o<0.01&&!t.m&&!fast)['x','y','w','h','fs','r'].forEach(k=>{if(to[k]!=null)from[k]=to[k]});const dur=(fast?.75:(t.t!=null?t.t:1.3))/SPEED,del=(fast?0:(t.d||0))/SPEED,e=fast?'io':(t.e||'io');
    items.push({el,from:Object.assign({},from),to,d:del,t:dur,e});maxEnd=Math.max(maxEnd,del+dur);}
  anim=items.length?{t0:performance.now(),items}:null;
  cur=n;holdAcc=0;if(typeof cdBox!=='undefined')cdBox.style.display='none';updateUI();
}
function lerp(a,b,p){return a+(b-a)*p}
function frame(now){
  const dt=now-lastNow;lastNow=now;
  if(anim){let done=true;const el_t=(now-anim.t0)/1000;
    for(const it of anim.items){let p=(el_t-it.d)/it.t;if(p<1)done=false;p=Math.max(0,Math.min(1,p));const q=EASE[it.e](p),c=it.el.cur;
      for(const k of NUM){const a=it.from[k],b=it.to[k];if(b==null)continue;if(a==null){c[k]=b;continue;}c[k]=lerp(a,b,(k==='o'&&it.e==='back')?EASE.out(p):q);}
      for(const k of COL){const a=it.from[k],b=it.to[k];if(!b)continue;if(!a){c[k]=b;continue;}c[k]=a.map((v,i)=>lerp(v,b[i],q));}
      apply(it.el);}
    if(done)anim=null;}
  else if(playing&&cur<STEPS.length-1){holdAcc+=dt/1000;if(holdAcc>=holdOf(STEPS[cur])/SPEED)goTo(cur+1,'auto');}
  else if(playing&&ROTATE&&cur===STEPS.length-1){holdAcc+=dt/1000;const END=4/SPEED,left=Math.ceil(15-(holdAcc-END));
    if(holdAcc>=END){cdBox.style.display='block';cdN.textContent=Math.max(0,Math.min(15,left));}
    if(holdAcc>=END+15){cdBox.style.display='none';restart();}}
  updateFill();
  requestAnimationFrame(frame);
}
function snap(n){DEFS.forEach(d=>{const el=EL[d.id];el.cur=Object.assign({},S[n][d.id]);apply(el)});cur=n;anim=null;holdAcc=0;updateUI();}

/* ================= Steuerung ================= */
const bPlay=document.getElementById('bPlay'),fill=document.getElementById('fill'),chap=document.getElementById('chap'),bar=document.getElementById('bar');
function updateUI(){
  const end=cur>=STEPS.length-1;
  if(!ROTATE&&typeof cdBox!=='undefined')cdBox.style.display='none';
  bPlay.innerHTML=(end&&!(ROTATE&&playing))?'↻<span class="lab"> Neu starten</span>':playing?'❚❚<span class="lab"> Pause</span>':'▶<span class="lab"> Abspielen</span>';
  chap.textContent=`${CHAPTERS[STEPS[Math.max(0,cur)].ch]} · ${Math.max(0,cur)+1}/${STEPS.length}`;}
function updateFill(){const last=STEPS.length-1;let f=cur/last;
  if(!anim&&cur<last)f+=Math.min(1,holdAcc*SPEED/holdOf(STEPS[cur]))/last;fill.style.width=(f*100)+'%';}
function ticks(){document.querySelectorAll('.tick').forEach(t=>t.remove());const last=STEPS.length-1;
  STEPS.forEach((s,i)=>{if(i&&s.ch!==STEPS[i-1].ch){const t=document.createElement('div');t.className='tick';t.style.left=(i/last*100)+'%';document.getElementById('track').parentNode.appendChild(t);}});}
document.getElementById('bNext').onclick=()=>goTo(cur+1,'next');
document.getElementById('bBack').onclick=()=>goTo(cur-1,'back');
const cdBox=document.getElementById('cd'),cdN=document.getElementById('cdn');
function restart(){playing=MODE!=='presentation'||playing;snapBlank();goTo(0,'auto');}
bPlay.onclick=()=>{if(cur>=STEPS.length-1&&!(ROTATE&&playing)){playing=true;cdBox.style.display='none';snapBlank();goTo(0,'auto');return;}playing=!playing;holdAcc=playing?holdAcc:holdAcc;updateUI();};
document.getElementById('bFs').onclick=()=>{const d=document.documentElement;if(!document.fullscreenElement){(d.requestFullscreen||d.webkitRequestFullscreen||(()=>{})).call(d)}else document.exitFullscreen()};
bar.onclick=e=>{const r=bar.getBoundingClientRect();const n=Math.round((e.clientX-r.left)/r.width*(STEPS.length-1));goTo(n,'jump');};
addEventListener('keydown',e=>{if(e.key===' '||e.key==='k'){e.preventDefault();bPlay.click()}else if(e.key==='ArrowRight'){goTo(cur+1,'next')}else if(e.key==='ArrowLeft'){goTo(cur-1,'back')}else if(e.key==='f'){document.getElementById('bFs').click()}});
function snapBlank(){DEFS.forEach(d=>{const el=EL[d.id];el.cur=Object.assign({},DEF,d.base);apply(el)});}

function layout(first){
  const r=wrap.getBoundingClientRect();const p=r.height>r.width*1.05;
  const W=p?900:1600,H=p?1600:900;
  if(!L||L.p!==p){const keep=cur;L={p,W,H};build();buildStates();
    if(first||keep<0){snapBlank();goTo(0,'auto');} else snap(keep);}
  const k=Math.min(r.width/W,r.height/H);
  stage.style.transform=`translate(${(r.width-W*k)/2}px,${(r.height-H*k)/2}px) scale(${k})`;
}
addEventListener('resize',()=>{if(MODE)layout(false)});
const urlStep=parseInt(new URLSearchParams(location.search).get('schritt'));
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{});
/* Menü (Rechtsklick / langes Drücken auf Play) */
const menu=document.getElementById('menu'),spd=document.getElementById('spd'),rot=document.getElementById('rot');
[20,50,75,100,125,150,200,300].forEach(v=>{const b=document.createElement('button');b.textContent=v+' %';b.dataset.v=v;b.onclick=()=>{SPEED=v/100;markMenu();};spd.appendChild(b);});
const det=document.getElementById('det'),dsecB=document.getElementById('dsec');
[5,8,10,12,15,20,30,45].forEach(v=>{const b=document.createElement('button');b.textContent=v+' s';b.dataset.v=v;b.onclick=()=>{DSEC=v;markMenu();};dsecB.appendChild(b);});
det.onchange=()=>{DETAILS=det.checked;rebuildSteps();markMenu();};
function rebuildSteps(){const keep=cur;composeSteps();build();buildStates();snap(Math.max(0,Math.min(keep,STEPS.length-1)));ticks();if(playing&&cur===BASE_STEPS.length-1)holdAcc=0;}
function markMenu(){dsecB.querySelectorAll('button').forEach(b=>b.classList.toggle('on',DSEC===+b.dataset.v));det.checked=DETAILS;spd.querySelectorAll('button').forEach(b=>b.classList.toggle('on',Math.round(SPEED*100)===+b.dataset.v));rot.checked=ROTATE;}
rot.onchange=()=>{ROTATE=rot.checked;if(!ROTATE)cdBox.style.display='none';if(ROTATE&&cur===STEPS.length-1){holdAcc=0;playing=true;}updateUI();};
function openMenu(x,y){markMenu();menu.style.display='block';const r=menu.getBoundingClientRect();
  menu.style.left=Math.max(8,Math.min(innerWidth-r.width-8,x))+'px';menu.style.top=Math.max(8,Math.min(innerHeight-r.height-8,y-r.height))+'px';}
bPlay.addEventListener('contextmenu',e=>{e.preventDefault();openMenu(e.clientX,e.clientY);});
let lpT=null,lpDone=false;
bPlay.addEventListener('touchstart',e=>{lpDone=false;const t=e.touches[0];lpT=setTimeout(()=>{lpDone=true;openMenu(t.clientX,t.clientY);},550);},{passive:true});
bPlay.addEventListener('touchend',e=>{clearTimeout(lpT);if(lpDone)e.preventDefault();});
addEventListener('pointerdown',e=>{if(menu.style.display==='block'&&!menu.contains(e.target)&&e.target!==bPlay&&!bPlay.contains(e.target))menu.style.display='none';});
addEventListener('keydown',e=>{if(e.key==='Escape')menu.style.display='none';});

if(!MODE){
  document.getElementById('app').style.display='none';
  const ld=document.getElementById('landing');ld.style.display='flex';
  document.getElementById('landLogo').src=IMG.logo;
  const m=document.getElementById('mail');
  if(BI_MAIL&&BI_MAIL.indexOf('@')>0){m.textContent=BI_MAIL;m.href='mailto:'+BI_MAIL;}else{m.textContent='E-Mail-Adresse folgt';m.removeAttribute('href');}
  const w=document.getElementById('web');w.href=BI_WEB;w.textContent=BI_WEB.replace(/^https?:\/\//,'').replace(/\/$/,'');
} else {
  if(MODE==='presentation')playing=false;
  layout(true);ticks();
  if(!isNaN(urlStep)){playing=false;snap(Math.max(0,Math.min(STEPS.length-1,urlStep-1)));}
  requestAnimationFrame(frame);
}
</script>
