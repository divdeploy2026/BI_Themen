<style>
:root{--red:#CD281E;--dg:#1E5A2B;--hg:#6DB33F;--gr:#232826;--bg:#F3F1EE;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="dark"]){--bg:#F3F1EE}}
:root[data-theme="dark"]{--bg:#F3F1EE}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--gr);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
.gk{color:var(--red)}
.warn{color:#E3A600;text-shadow:0 0 1px #5a4300}
/* Kopfleiste */
header{background:#fff;border-bottom:clamp(4px,.6vh,8px) solid var(--hg);text-align:center;padding:1.5vh 16px 1.3vh;flex:0 0 auto}
header h1{margin:0;font-weight:900;letter-spacing:.05em;font-size:clamp(20px,3.7vh,48px);line-height:1.1}
header h1 .r{color:var(--red)} header h1 .g{color:var(--dg)}
header .linie{width:min(980px,82%);height:2px;background:var(--dg);margin:.9vh auto}
header h2{margin:0;font-weight:800;font-size:clamp(18px,3.5vh,44px);line-height:1.15}
/* Raster */
main{flex:1;display:flex;min-height:0;padding:1.6vh 2vw;gap:1.2vw}
.matrix{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1.15fr) repeat(6,minmax(0,1.35fr)) minmax(0,.75fr);grid-template-rows:repeat(7,minmax(0,1fr));gap:.85vh .45vw}
.zeile{display:contents}
.kopf{background:var(--c);border-radius:10px;color:#fff;font-weight:800;display:flex;align-items:center;padding:0 .9vw;font-size:clamp(12px,1.95vh,24px);line-height:1.15}
.thema{background:var(--t);border:3px solid transparent;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:.4vh .5vw;font:inherit;color:inherit;font-weight:800;font-size:clamp(12px,2.3vh,28px);line-height:1.12;min-width:0;overflow:hidden}
.thema,.kopf{container-type:inline-size}
.thema .titel{display:block;font-size:min(2.4vh,10.4cqi);hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;max-width:100%}
.kopf span{font-size:min(2vh,11cqi);hyphens:auto;-webkit-hyphens:auto}
.mehr{-webkit-mask-image:linear-gradient(90deg,#000 45%,transparent 95%);mask-image:linear-gradient(90deg,#000 45%,transparent 95%);background:linear-gradient(90deg,var(--t) 0%,rgba(255,255,255,0) 100%);border:0;border-radius:10px;display:flex;flex-direction:column;justify-content:center;padding:0 .7vw;font:inherit;font-size:clamp(10px,1.45vh,17px);color:rgba(35,40,38,.45);font-weight:600;line-height:1.45;overflow:hidden;white-space:nowrap;text-align:left}
.mehr .dots{color:var(--c);font-weight:900;font-size:2.3em;line-height:.7;letter-spacing:.06em}
/* Fußzeile */
footer{background:#fff;border-top:clamp(4px,.5vh,6px) solid var(--hg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:.7vh 2vw;gap:16px;flex:0 0 auto}
footer .l b{display:block;color:var(--dg);font-size:clamp(15px,2.4vh,30px);font-weight:800}
footer .l span{font-size:clamp(12px,1.75vh,21px);font-weight:600}
footer img{height:clamp(56px,10.5vh,140px);display:block}
footer .r{text-align:right;font-size:clamp(11px,1.6vh,19px);font-weight:600;line-height:1.5;color:#4b524e}
footer .r a{color:inherit;text-decoration:none}
footer .r a:hover{color:var(--dg)}

/* Schmale Bildschirme: jedes Themengebiet als eigener Block */
@media (max-width:820px),(max-aspect-ratio:4/5){
  body{height:auto}
  header{padding:12px 12px 10px}
  header h1{font-size:clamp(17px,5.2vw,30px)} header h2{font-size:clamp(16px,4.8vw,26px)} header .linie{margin:6px auto}
  main{padding:14px 16px;display:block}
  .matrix{display:block}
  .zeile{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:16px}
  .kopf{grid-column:1/-1;padding:9px 12px;font-size:16px}
  .thema{font-size:15px;min-height:58px;padding:8px 6px}
  .thema .titel{font-size:15px} .kopf span{font-size:16px}
  .mehr{-webkit-mask-image:none;mask-image:none}
  .mehr{grid-column:1/-1;flex-direction:row;align-items:center;gap:10px;padding:6px 12px;font-size:13px;white-space:normal;background:linear-gradient(90deg,var(--t),rgba(255,255,255,0))}
  .mehr .dots{font-size:24px;line-height:1}
  footer{grid-template-columns:1fr;text-align:center;padding:14px 16px;gap:10px}
  footer .r{text-align:center} footer img{margin:0 auto;height:96px}
}
@media (min-width:560px) and (max-width:820px){.zeile{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
  <h1><span class="r">GASKRAFTWERK</span> <span class="g">SCHLÜCHTERN</span></h1>
  <div class="linie"></div>
  <h2 id="untertitel"></h2>
</header>
<main>
  <div class="matrix" id="matrix"></div>
  
</main>
<footer>
  <div class="l"><b id="fussLinks1"></b><span id="fussLinks2"></span></div>
  <img id="logo" alt="Logo Bürgerinitiative Lebenswertes Schlüchtern">
  <div class="r" id="fussRechts"></div>
</footer>
<script>
function fmt(s){
  const esc=String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return esc.replace(/Gaskraftwerk(e?s)?/g,m=>'<span class="gk">'+m+'</span>').replace(/⚠/g,'<span class="warn">⚠</span>');
}
document.getElementById('untertitel').innerHTML=fmt(TEXTE.untertitel);
document.getElementById('fussLinks1').innerHTML=fmt(TEXTE.fussLinks1);
document.getElementById('fussLinks2').innerHTML=fmt(TEXTE.fussLinks2);
document.getElementById('fussRechts').innerHTML=
  fmt(TEXTE.fussRechts)+'<br><a href="mailto:'+TEXTE.email+'">'+TEXTE.email+'</a> · <a href="'+TEXTE.webseite+'" target="_blank" rel="noopener">'+TEXTE.webseite.replace(/^https?:\/\//,'').replace(/\/$/,'')+'</a>';
document.title=TEXTE.seitentitel;

const m=document.getElementById('matrix');
THEMENGEBIETE.forEach(g=>{
  const z=document.createElement('div');z.className='zeile';z.style.setProperty('--c',g.farbe);z.style.setProperty('--t',g.hintergrund);
  z.innerHTML='<div class="kopf"><span>'+fmt(g.name)+'</span></div>'+g.themen.map(t=>'<div class="thema"><span class="titel">'+fmt(t)+'</span></div>').join('')+
    '<div class="mehr" aria-label="weitere Themen">'+g.weitere.map(w=>'<span>'+fmt(w)+'</span>').join('')+'<span class="dots">…</span></div>';
  m.appendChild(z);});

</script>
